name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Ensure outputs/ directory exists (checkpoint isn't committed to git)
        run: mkdir -p outputs

      - name: Verify Docker image builds
        run: docker build -f docker/Dockerfile -t robot-ai-inspection-api:ci-test .